{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>ToDo-Solo | Tasks</title>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <style>
        body {
            flex-direction: column;
            padding: 20px;
        }

        .container {
            width: 400px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .task {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            padding: 10px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            transition: 0.2s;
        }

        .task:hover {
            transform: scale(1.02);
        }

        .task-title {
            font-size: 14px;
        }

        .completed {
            text-decoration: line-through;
            color: #9ca3af;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .btn-small {
            padding: 5px 8px;
            font-size: 12px;
            border-radius: 6px;
        }

        .btn-complete {
            background: #22c55e;
        }

        .btn-delete {
            background: #ef4444;
        }

        .btn-edit {
            background: #f59e0b;
        }
    </style>
</head>

<body>

<div class="container">
    
    <div class="top-bar">
        <h2 class="page-title">My Tasks</h2>

        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" class="btn-small">Logout</button>
        </form>
    </div>

    <form method="POST" class="input-group">
        {% csrf_token %}
        <input type="text" name="title" placeholder="Add new task..." required />
        <button type="submit">Add Task</button>
    </form>

    <div style="margin-top:15px;">

        {% for task in tasks %}
            <div class="task">

                <span id="task-title-{{task.id}}" class="task-title {% if task.completed %}completed{% endif %}">
                    {{ task.title }}
                </span>

                <input 
                    id="edit-input-{{task.id}}" 
                    value="{{ task.title }}" 
                    style="display:none; padding:5px; border-radius:6px;"
                    type="text"
                />

                <div class="actions">

                    {% if not task.completed %}
                        <a href="/complete/{{ task.id }}">
                            <button type="button" class="btn-small btn-complete">✔</button>
                        </a>
                    {% endif %}

                    <button type="button" class="btn-small btn-edit" onclick="editTask({{task.id}})">✏</button>

                    <button 
                        type="button"
                        class="btn-small btn-complete" 
                        onclick="saveTask({{task.id}})" 
                        id="save-btn-{{task.id}}" 
                        style="display:none;">
                        💾
                    </button>

                    <a href="/delete/{{ task.id }}">
                        <button type="button" class="btn-small btn-delete">🗑</button>
                    </a>

                </div>

            </div>
        {% empty %}
            <p class="switch">No tasks yet 🚀</p>
        {% endfor %}

    </div>

</div>

<script>
function editTask(id) {
    document.getElementById("task-title-" + id).style.display = "none";
    document.getElementById("edit-input-" + id).style.display = "inline-block";
    document.getElementById("save-btn-" + id).style.display = "inline-block";
    document.getElementById("edit-input-" + id).focus();
}

function saveTask(id) {
    const input = document.getElementById("edit-input-" + id);
    const token = document.querySelector('[name=csrfmiddlewaretoken]').value;

    fetch(`/api/tasks/${id}/`, {
        method: "PUT",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": token
        },
        body: JSON.stringify({
            "title": input.value
        })
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById("task-title-" + id).innerText = data.title;
        document.getElementById("task-title-" + id).style.display = "inline";
        document.getElementById("edit-input-" + id).style.display = "none";
        document.getElementById("save-btn-" + id).style.display = "none";
    })
    .catch(error => {
        console.error('Error:', error);
        alert('حدث خطأ في حفظ المهمة');
    });
}
</script>

</body>
</html>
