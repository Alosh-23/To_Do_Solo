{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>ToDo-Solo | Tasks</title>

    <!-- نفس الخطوط -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <!-- نفس CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <style>
        /* تعديل بسيط ليتناسب مع قائمة المهام */
        body {
            flex-direction: column;
            padding: 20px;
        }

        .container {
            width: 400px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .task {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            padding: 10px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            transition: 0.2s;
        }

        .task:hover {
            transform: scale(1.02);
        }

        .task-title {
            font-size: 14px;
        }

        .completed {
            text-decoration: line-through;
            color: #9ca3af;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .btn-small {
            padding: 5px 8px;
            font-size: 12px;
            border-radius: 6px;
        }

        .btn-complete {
            background: #22c55e;
        }

        .btn-delete {
            background: #ef4444;
        }

        .btn-edit {
            background: #f59e0b;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- 🔝 العنوان + logout -->
    <div class="top-bar">
        <h2 class="page-title">My Tasks</h2>

        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button class="btn-small">Logout</button>
        </form>
    </div>

    <!-- ➕ إضافة مهمة -->
    <form method="POST" class="input-group">
        {% csrf_token %}
        <input type="text" name="title" placeholder="Add new task..." required>
        <button type="submit">Add Task</button>
    </form>

    <!-- 📋 عرض المهام -->
    <div style="margin-top:15px;">

        {% for task in tasks %}
            <div class="task">

                <span class="task-title {% if task.completed %}completed{% endif %}">
                    {{ task.title }}
                </span>

                <div class="actions">

                    {% if not task.completed %}
                        <a href="/complete/{{ task.id }}">
                            <button class="btn-small btn-complete">✔</button>
                        </a>
                    {% endif %}

                    <a href="/edit/{{ task.id }}">
                        <button class="btn-small btn-edit">✏</button>
                    </a>

                    <a href="/delete/{{ task.id }}">
                        <button class="btn-small btn-delete">🗑</button>
                    </a>

                </div>

            </div>
        {% empty %}
            <p class="switch">No tasks yet 🚀</p>
        {% endfor %}

    </div>

</div>

</body>
</html>
