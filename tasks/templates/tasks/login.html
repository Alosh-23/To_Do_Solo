{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>ToDo-Solo | Login</title>

    <!-- 🔥 الخط -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <!-- 🎨 CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="auth-page">

    <div class="container">
        <img src="{% static 'images/ToDo-solo-logo.png' %}" class="logo" alt="ToDo-Solo logo">
        <h1 class="app-title">ToDo-Solo</h1>
        <h2 class="page-title">Welcome back</h2>
        <p class="hero-copy">Organize your day, stay focused, and keep your momentum going.</p>

        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST" class="input-group">
            {% csrf_token %}
            <input type="text" name="login" placeholder="Username, Email or Phone" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>

        <p class="switch">
            <a href="{% url 'forgot_password' %}">Forgot Password?</a>
        </p>

        <p class="switch">
            Don't have an account?
            <a href="{% url 'register' %}">Create an account</a>
        </p>
    </div>

</body>
</html>
