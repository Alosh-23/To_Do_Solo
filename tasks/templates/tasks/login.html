{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>ToDo-Solo | Login</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <div class="container">

        <!-- 🖼 اللوقو -->
        <img src="{% static 'images/ToDo-solo-logo.png' %}" class="logo" alt="logo">

        <!-- ✨ اسم التطبيق -->
        <h1 class="app-title">ToDo-Solo</h1>

        <!-- 🔐 عنوان الصفحة -->
        <h2 class="page-title">Login</h2>

        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}

        <!-- 🧾 الفورم -->
        <form method="POST" class="input-group">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Login</button>
        </form>

        <!-- 🔗 رابط التسجيل -->
        <p class="switch">
            Don't have an account? 
            <a href="{% url 'register' %}">Create an account</a>
        </p>

    </div>

</body>
</html>
