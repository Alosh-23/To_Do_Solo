{% load static %}

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>ToDo-Solo | نسيت كلمة المرور</title>

  <!-- 🔥 نفس الخطوط تماماً من صفحة Login -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <!-- 🎨 نفس CSS الخارجي -->
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="auth-page">
  <div class="container">
    <img src="{% static 'images/ToDo-solo-logo.png' %}" class="logo" alt="ToDo-Solo Logo">
    <h1 class="app-title">ToDo-Solo</h1>
    <h2 class="page-title">Forgot password</h2>
    <p class="hero-copy">We’ll send a recovery link to the email you registered with.</p>

    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}

    {% if success %}
      <p class="success">{{ success }}</p>
    {% endif %}

    <form method="POST" class="input-group">
      {% csrf_token %}
      <input type="email" name="email" placeholder="Email address" required>
      <button type="submit">Send recovery code</button>
    </form>

    <p class="switch">
      <a href="{% url 'login' %}">Back to login</a>
    </p>
  </div>
</body>
</html>
