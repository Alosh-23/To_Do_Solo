{% load static %}

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>ToDo-Solo | نسيت كلمة المرور</title>

  <!-- 🔥 نفس الخطوط تماماً من صفحة Login -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <!-- 🎨 نفس CSS الخارجي -->
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>
  <div class="container">

    <!-- 🖼️ نفس اللوقو تماماً -->
    <img src="{% static 'images/ToDo-solo-logo.png' %}" class="logo" alt="ToDo-Solo Logo">

    <!-- ✨ نفس اسم التطبيق تماماً -->
    <h1 class="app-title">ToDo-Solo</h1>
    
    <!-- 🔐 عنوان الصفحة -->
    <h2 class="page-title">نسيت كلمة المرور</h2>

    <!-- رسائل الخطأ/نجاح -->
    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}

    {% if success %}
      <p class="success">{{ success }}</p>
    {% endif %}

    <!-- 🧾 نفس الفورم style -->
    <form method="POST" class="input-group">
      {% csrf_token %}
      <input type="email" name="email" placeholder="Username أو Email أو Phone" required>
      <button type="submit">إرسال رمز التحقق</button>
    </form>

    <!-- 🔗 رابط العودة بنفس الستايل -->
    <p class="switch">
      <a href="{% url 'login' %}">العودة لتسجيل الدخول</a>
    </p>

  </div>

  <!-- 🔥 نفس الـ scripts إذا كان موجودة في login -->
  <script src="{% static 'js/script.js' %}"></script>

</body>
</html>
