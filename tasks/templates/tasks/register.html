{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>ToDo-Solo | Register</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <div class="container">

        <!-- 🖼 اللوقو -->
        <img src="{% static 'images/ToDo-solo-logo.png' %}" class="logo" alt="logo">

        <!-- ✨ اسم التطبيق -->
        <h1 class="app-title">ToDo-Solo</h1>
        <h2 class="page-title">Create Account</h2>

        <form method="POST" class="input-group">
            {% csrf_token %}

            <!-- Username -->
            <input type="text" name="username" placeholder="Username" required>

            <!-- Password -->
            <input type="password" name="password1" id="password1" placeholder="Password" required>

            <!-- شروط كلمة المرور -->
            <div id="password-help" class="password-help">
                <small>
                    • At least 8 characters <br>
                    • Not too common <br>
                    • Not only numbers
                </small>
            </div>

            <!-- Confirm Password -->
            <input type="password" name="password2" placeholder="Confirm Password" required>

            <button type="submit">Register</button>
        </form>

        <p class="switch">
            Already have an account?
            <a href="{% url 'login' %}">Login</a>
        </p>

    </div>

    <!-- 🔥 JavaScript -->
    <script>
        const passwordInput = document.getElementById("password1");
        const helpText = document.getElementById("password-help");

        passwordInput.addEventListener("focus", () => {
            helpText.style.display = "block";
        });

        passwordInput.addEventListener("blur", () => {
            if (passwordInput.value === "") {
                helpText.style.display = "none";
            }
        });
    </script>

</body>
</html>
