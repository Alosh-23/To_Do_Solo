{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>ToDo-Solo | Register</title>

    <!-- 🔥 خط احترافي -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <div class="container">

        <img src="{% static 'images/ToDo-solo-logo.png' %}" class="logo">

        <h1 class="app-title">ToDo-Solo</h1>
        <h2 class="page-title">Create Account</h2>

        <form method="POST" class="input-group">
            {% csrf_token %}

            <input type="text" name="username" placeholder="Username" required>

            <input type="password" name="password1" id="password1" placeholder="Password" required>

            <!-- 🔐 متطلبات كلمة المرور -->
            <div id="password-help" class="password-help">
                <small id="length">• 8+ characters</small><br>
                <small id="number">• Contains number</small><br>
                <small id="letter">• Contains letter</small>
            </div>

            <!-- 💪 قوة كلمة المرور -->
            <p id="strength" class="strength"></p>

            <input type="password" name="password2" placeholder="Confirm Password" required>

            <button type="submit">Register</button>
        </form>

        <p class="switch">
            Already have an account?
            <a href="{% url 'login' %}">Login</a>
        </p>

    </div>

    <!-- 🔥 JavaScript -->
    <script>
        const password = document.getElementById("password1");
        const help = document.getElementById("password-help");
        const strength = document.getElementById("strength");

        const length = document.getElementById("length");
        const number = document.getElementById("number");
        const letter = document.getElementById("letter");

        password.addEventListener("focus", () => {
            help.style.display = "block";
        });

        password.addEventListener("input", () => {
            let value = password.value;

            // تحقق من الشروط
            let hasLength = value.length >= 8;
            let hasNumber = /[0-9]/.test(value);
            let hasLetter = /[a-zA-Z]/.test(value);

            length.style.color = hasLength ? "lightgreen" : "white";
            number.style.color = hasNumber ? "lightgreen" : "white";
            letter.style.color = hasLetter ? "lightgreen" : "white";

            // قوة كلمة المرور
            if (value.length === 0) {
                strength.textContent = "";
            } else if (hasLength && hasNumber && hasLetter) {
                strength.textContent = "Strong 💪";
                strength.style.color = "lightgreen";
            } else {
                strength.textContent = "Weak ⚠️";
                strength.style.color = "orange";
            }
        });

        password.addEventListener("blur", () => {
            if (password.value === "") {
                help.style.display = "none";
                strength.textContent = "";
            }
        });
    </script>

</body>
</html>
