{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ToDo-Solo Dashboard</title>
    <link rel="icon" href="{% static 'images/ToDo-solo-logo.png' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/layout.css' %}">
    <link rel="stylesheet" href="{% static 'css/tasks.css' %}">
    <meta name="csrf-token" content="{{ csrf_token }}">
</head>

<body>
    <button id="menu-toggle" class="menu-toggle">☰</button>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="logo-title">ToDo-Solo</div>
            <div class="sidebar-nav">
                <button id="dashboard-btn" class="nav-btn">Dashboard</button>
                <button id="tasks-btn" class="nav-btn">Tasks</button>
                <button id="quests-btn" class="nav-btn">Quests</button>
                <button id="missions-btn" class="nav-btn">Missions</button>
                <button id="achievements-btn" class="nav-btn">Achievements</button>
                <button id="stats-btn" class="nav-btn">Stats</button>
                <button id="settings-btn" class="nav-btn">Settings</button>
            </div>
        </aside>

        <main class="main-content">
            <section id="dashboard-section">
                <h1>Dashboard</h1>
                <div class="xp-container">
                    <p class="level-text">Level <span id="level">1</span></p>
                    <div class="xp-bar"><div id="xp-fill" class="xp-fill"></div></div>
                    <p><span id="xp">0</span> XP / <span id="next-level-xp">100</span></p>
                </div>
                <div id="home-task-list"></div>
                <div id="xp-popup-container"></div>
                <div id="achievement-container"></div>
            </section>

            <section id="tasks-section" style="display:none;">
                <h1>Tasks</h1>
                <form id="task-form" class="input-group">
                    {% csrf_token %}
                    <input type="text" name="title" placeholder="Add a new task..." required>
                    <button type="submit">Add Task</button>
                </form>
                <ul id="task-list"></ul>
            </section>

            <section id="quests-section" style="display:none;">
                <h1>Quests</h1>
                <div id="quests-list"></div>
            </section>

            <section id="missions-section" style="display:none;">
                <h1>Missions</h1>
                <div id="missions-list"></div>
            </section>

            <section id="achievements-section" style="display:none;">
                <h1>Achievements</h1>
                <div id="achievement-container"></div>
            </section>

            <section id="stats-section" style="display:none;">
                <h1>Leaderboard</h1>
                <div id="leaderboard-list"></div>
            </section>

            <section id="settings-section" style="display:none;">
                <h1>Settings</h1>
                <p>Settings coming soon.</p>
            </section>
        </main>
    </div>

    <script type="module" src="{% static 'js/tasks.js' %}"></script>
</body>
</html>
