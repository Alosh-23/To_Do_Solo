{% load i18n %}

<section class="card welcome-card">

    <div class="card-body">

        <p class="welcome-eyebrow">
            {{ greeting }}
        </p>

        <h1 class="welcome-title">

            {% if request.user.is_authenticated %}
                {{ request.user.username }}
            {% else %}
                {% translate "Guest" %}
            {% endif %}

            👋

        </h1>

        <p class="welcome-description">
            {% translate "Let's make today productive." %}
        </p>

    </div>

</section>
